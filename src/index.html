<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Clip Loop</title>
<style>
  :root { --bg:#10151f; --card:#1c2433; --focus:#ffcc33; --text:#fff; --btn:rgba(255,255,255,.88); }
  * { box-sizing:border-box; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #grid {
    display:grid; gap:28px; padding:36px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  }
  .clip {
    all:unset; cursor:pointer; background:var(--card); border-radius:26px;
    overflow:hidden; outline:7px solid transparent;
    transition:transform .15s, outline-color .15s;
  }
  .clip:focus, .clip:hover { outline-color:var(--focus); transform:scale(1.04); }
  .clip img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; }
  .clip span { display:block; padding:16px 18px; font-size:26px; font-weight:700; text-align:center; }
  .clip.broken { opacity:.35; }
  #msg { padding:40px; font-size:22px; }

  #player-wrap { position:fixed; inset:0; background:#000; display:none; }
  #player-wrap.on { display:block; }
  #player { position:absolute; inset:0; width:100%; height:100%; }
  /* Transparent layer over the video so taps never reach YouTube's UI/links */
  #shield { position:absolute; inset:0; }

  .round {
    position:absolute; width:96px; height:96px; border-radius:50%; border:none;
    background:var(--btn); color:#111; cursor:pointer; padding:0;
    outline:7px solid transparent;
    display:flex; align-items:center; justify-content:center;
  }
  .round:focus { outline-color:var(--focus); }
  .round[hidden] { display:none; }
  .round svg { width:52px; height:52px; }
  #back { top:calc(24px + env(safe-area-inset-top)); left:calc(24px + env(safe-area-inset-left)); }
  #fs { top:calc(24px + env(safe-area-inset-top)); right:calc(24px + env(safe-area-inset-right)); }

  #bar {
    position:absolute;
    left:calc(24px + env(safe-area-inset-left));
    right:calc(24px + env(safe-area-inset-right));
    bottom:calc(24px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:24px;
    padding:14px 30px 14px 14px; border-radius:64px; background:rgba(0,0,0,.55);
  }
  #play { position:static; flex:none; }
  #time { flex:none; font-size:22px; font-variant-numeric:tabular-nums; }

  /* Big, finger-friendly slider */
  #seek {
    flex:1; min-width:0; height:52px; margin:0;
    -webkit-appearance:none; appearance:none; background:transparent; outline:none;
  }
  #seek::-webkit-slider-runnable-track {
    height:14px; border-radius:7px;
    background:linear-gradient(to right, var(--focus) var(--pct,0%), rgba(255,255,255,.35) var(--pct,0%));
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance:none; width:44px; height:44px; margin-top:-15px; border-radius:50%;
    background:#fff; border:none; box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  #seek:focus::-webkit-slider-thumb { box-shadow:0 0 0 7px var(--focus); }
  #seek::-moz-range-track { height:14px; border-radius:7px; background:rgba(255,255,255,.35); }
  #seek::-moz-range-progress { height:14px; border-radius:7px; background:var(--focus); }
  #seek::-moz-range-thumb { width:44px; height:44px; border-radius:50%; background:#fff; border:none; }
  #seek:focus::-moz-range-thumb { box-shadow:0 0 0 7px var(--focus); }

  /* Controls fade away while playing; a tap or remote press brings them back */
  .ctl { transition:opacity .3s; }
  #player-wrap.idle .ctl { opacity:0; pointer-events:none; }

  @media (max-width:600px) {
    .round { width:72px; height:72px; }
    .round svg { width:40px; height:40px; }
    #time { display:none; }
  }
</style>
</head>
<body>
  <div id="grid"></div>

  <div id="player-wrap">
    <div id="player"></div>
    <div id="shield"></div>
    <button id="back" class="round ctl" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <button id="fs" class="round ctl" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div id="bar" class="ctl">
      <button id="play" class="round" aria-label="Pause"></button>
      <input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Position in clip">
      <div id="time">0:00 / 0:00</div>
    </div>
  </div>

  <script src="clips.js"></script>
  <script>
  (() => {
    const POLL_MS = 200;
    const IDLE_MS = 4000;
    const SKIP_S = 5;
    const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></svg>';

    const $ = id => document.getElementById(id);
    const grid = $('grid'), wrap = $('player-wrap'), shield = $('shield');
    const backBtn = $('back'), fsBtn = $('fs'), playBtn = $('play');
    const seek = $('seek'), timeEl = $('time');

    let player = null, ready = false, pending = null;
    let current = null, timer = null, lastCard = null;
    let dragging = false, idleTimer = null;

    // "1:23", "1:02:03", or plain seconds -> seconds
    const toSec = t => typeof t === 'number' ? t
      : String(t).split(':').reduce((a, p) => a * 60 + parseFloat(p), 0);
    const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

    const clips = (window.CLIPS || []).map(c => ({
      ...c, start: toSec(c.start ?? 0), end: c.end == null ? 0 : toSec(c.end)
    }));

    if (!clips.length) {
      grid.innerHTML = '<p id="msg">No clips yet — add some to clips.js.</p>';
    }

    clips.forEach(c => {
      const b = document.createElement('button');
      b.className = 'clip';
      const img = document.createElement('img');
      img.alt = '';
      img.src = c.thumb || `https://i.ytimg.com/vi/${encodeURIComponent(c.videoId)}/hqdefault.jpg`;
      const label = document.createElement('span');
      label.textContent = c.title || '';
      b.append(img, label);
      b.addEventListener('click', () => play(c, b));
      c.card = b;
      grid.appendChild(b);
    });
    grid.firstElementChild?.focus();

    // ---- Full screen (whole page, so the grid stays full screen too) ----
    const root = document.documentElement;
    const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
    function enterFs() {
      if (!canFs || fsOn()) return;
      try { const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); p?.catch?.(() => {}); } catch {}
    }
    function exitFs() {
      if (!fsOn()) return;
      try { const p = (document.exitFullscreen || document.webkitExitFullscreen).call(document); p?.catch?.(() => {}); } catch {}
    }
    if (!canFs) fsBtn.hidden = true;
    fsBtn.addEventListener('click', () => { fsOn() ? exitFs() : enterFs(); poke(); });

    // ---- YouTube IFrame API ----
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('player', {
        width: '100%', height: '100%',
        playerVars: {
          controls: 0, disablekb: 1, fs: 0, rel: 0,
          playsinline: 1, iv_load_policy: 3, modestbranding: 1
        },
        events: {
          onReady: () => {
            ready = true;
            if (pending) { const [c, b] = pending; pending = null; play(c, b); }
          },
          onStateChange: e => {
            // Video ended before the clip's end time: loop anyway
            if (e.data === YT.PlayerState.ENDED && current) {
              player.seekTo(current.start, true);
              player.playVideo();
            }
            setPlayIcon();
            if (e.data === YT.PlayerState.PLAYING) poke(); // start the fade-out timer
            else wrap.classList.remove('idle');           // keep controls up while paused
          },
          onError: () => {
            // 101/150 = owner disabled embedding; 100 = removed/private
            if (current?.card) current.card.classList.add('broken');
            stop();
          }
        }
      });
    };

    const isPlaying = () => {
      const s = player?.getPlayerState();
      return s === YT.PlayerState.PLAYING || s === YT.PlayerState.BUFFERING;
    };
    const clipEnd = () => current.end || player.getDuration() || 0;

    function setPlayIcon() {
      const p = isPlaying();
      playBtn.innerHTML = p ? ICON_PAUSE : ICON_PLAY;
      playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
    }

    function togglePlay() {
      if (!current || !player) return;
      isPlaying() ? player.pauseVideo() : player.playVideo();
      poke();
    }

    // Show controls, then hide them again after a few seconds of playing
    function poke() {
      wrap.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (current && !dragging && player.getPlayerState() === YT.PlayerState.PLAYING) wrap.classList.add('idle');
      }, IDLE_MS);
    }

    function updateUI() {
      if (!current || !player) return;
      const start = current.start, end = clipEnd();
      if (end > start) { seek.min = start; seek.max = end; }
      const t = dragging ? +seek.value : player.getCurrentTime();
      if (!dragging) seek.value = t;
      const pct = end > start ? (t - start) / (end - start) * 100 : 0;
      seek.style.setProperty('--pct', Math.min(100, Math.max(0, pct)) + '%');
      timeEl.textContent = fmt(t - start) + ' / ' + fmt(end - start);
    }

    function check() {
      if (!current || !player) return;
      if (!dragging && player.getPlayerState() === YT.PlayerState.PLAYING) {
        const end = clipEnd();
        if (end && player.getCurrentTime() >= end - 0.15) player.seekTo(current.start, true);
      }
      updateUI();
    }

    function play(c, card) {
      lastCard = card;
      enterFs();  // tap on a clip counts as the user gesture full screen needs
      if (!ready) { pending = [c, card]; return; }
      current = c;
      dragging = false;
      seek.min = c.start; seek.max = c.end || c.start + 1; seek.value = c.start;
      seek.style.setProperty('--pct', '0%');
      timeEl.textContent = '0:00 / ' + fmt((c.end || c.start) - c.start);
      playBtn.innerHTML = ICON_PAUSE;
      wrap.classList.add('on');
      history.pushState({ playing: true }, '');
      player.loadVideoById({ videoId: c.videoId, startSeconds: c.start });
      clearInterval(timer);
      timer = setInterval(check, POLL_MS);
      poke();
      playBtn.focus();
    }

    function stop(fromPopstate) {
      clearInterval(timer);
      clearTimeout(idleTimer);
      current = null;
      dragging = false;
      if (player && ready) player.stopVideo();
      wrap.classList.remove('on', 'idle');
      if (!fromPopstate && history.state?.playing) history.back();
      (lastCard || grid.firstElementChild)?.focus();
    }

    // ---- Controls ----
    backBtn.addEventListener('click', () => stop());
    playBtn.addEventListener('click', togglePlay);

    seek.addEventListener('pointerdown', () => { dragging = true; poke(); });
    seek.addEventListener('input', () => {
      dragging = true;
      player.seekTo(+seek.value, false);
      updateUI();
      poke();
    });
    seek.addEventListener('change', () => {
      player.seekTo(+seek.value, true);
      dragging = false;
      poke();
    });
    const endDrag = () => setTimeout(() => { dragging = false; }, 0);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    // Tapping the video brings the controls back
    shield.addEventListener('click', poke);

    // TV remote "Back" and iPad swipe-back go through browser history
    window.addEventListener('popstate', () => { if (current) stop(true); });

    // ---- D-pad / arrow-key navigation for the TV remote ----
    document.addEventListener('keydown', e => {
      if (current) {
        // First press while controls are hidden just shows them
        if (wrap.classList.contains('idle')) { e.preventDefault(); poke(); return; }
        poke();
        if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); stop(); return; }
        if (e.key === 'MediaPlayPause' || e.key === 'k') { e.preventDefault(); togglePlay(); return; }
        if (e.key === 'MediaPlay') { e.preventDefault(); player.playVideo(); return; }
        if (e.key === 'MediaPause') { e.preventDefault(); player.pauseVideo(); return; }

        const arrows = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
        if (!arrows.includes(e.key)) return;
        e.preventDefault();

        // On the slider, left/right skip through the clip
        if (document.activeElement === seek && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
          const step = e.key === 'ArrowRight' ? SKIP_S : -SKIP_S;
          const t = Math.min(clipEnd(), Math.max(current.start, player.getCurrentTime() + step));
          player.seekTo(t, true);
          updateUI();
          return;
        }
        // Otherwise move between back, play, slider, full screen
        const order = [backBtn, playBtn, seek, fsBtn].filter(el => !el.hidden);
        const i = order.indexOf(document.activeElement);
        if (i < 0) { playBtn.focus(); return; }
        const dir = (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : 1;
        order[(i + dir + order.length) % order.length].focus();
        return;
      }

      const cards = [...grid.children];
      let i = cards.indexOf(document.activeElement);
      if (i < 0) { cards[0]?.focus(); return; }
      const top = cards[0].offsetTop;
      const cols = Math.max(1, cards.filter(el => el.offsetTop === top).length);
      const move = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
      if (move !== undefined) {
        e.preventDefault();
        const j = Math.min(cards.length - 1, Math.max(0, i + move));
        cards[j].focus();
        cards[j].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  })();
  </script>
</body>
</html>
